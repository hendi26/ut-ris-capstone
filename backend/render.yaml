services:
  - type: web
    name: utris-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: utris-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://utris.vercel.app"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: ORTHANC_URL
        value: "http://localhost:8042"
      - key: ORTHANC_USER
        value: "orthanc"
      - key: ORTHANC_PASSWORD
        value: "orthanc"

databases:
  - name: utris-db
    databaseName: utris
    user: utris_user
    plan: free
